{% extends "base.html" %}

{% block title %}Locomotive{% endblock %}

{% block content %}
    {% if user.is_authenticated %}
        <h1>Welcome back, {{ user.username }}</h1>
    {% else %}
        <hgroup>
            <h1>Locomotive</h1>
            <p>Coopérative Locale de Mobilité</p>
        </hgroup>
        <a href="{% url 'login' %}" role="button">Log in to get started</a>
    {% endif %}
{% endblock %}
