[project]
name = "locomotive"
version = "0.1.0"
description = "Coopérative Locale de Mobilité"
readme = "README.md"
authors = [
    { name = "Antoine Gallix", email = "7696611+antoine-gallix@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "locomotive.settings"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
addopts = "--strict-markers"
